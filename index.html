<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Coal Business Development PLN EPI · Dashboard Kinerja &amp; Coal Intelligence · Live News 30s · Embedded AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js">
    </script>
    <style>
        :root {
            --ink: #1F2430;
            --ink-soft: #6B7280;
            --border: #E4E1D8;
            --bg: #EFEDE6;
        }
        * {
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
        }
        body {
            margin: 0;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            padding: 24px 22px 50px;
            position: relative;
        }
        .bg-scene {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0.35;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background-image: linear-gradient(115deg, rgba(7, 22, 38, .88) 0%, rgba(14, 59, 78, .55) 38%, rgba(255, 255, 255, .18) 70%, rgba(255, 255, 255, .05) 100%), url('https://commons.wikimedia.org/wiki/Special:Redirect/file/PLTU_Paiton_dari_jalan.jpg');
            background-size: cover;
            background-position: center 48%;
            background-repeat: no-repeat;
        }
        .bg-scene svg {
            display: none;
        }
        .bg-credit {
            font-size: 9px;
            color: rgba(255, 255, 255, .55);
            position: fixed;
            right: 12px;
            bottom: 8px;
            z-index: 2;
            pointer-events: none;
        }
        .wrap {
            max-width: 1120px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 22px;
            box-shadow: 0 2px 10px rgba(31, 36, 48, 0.05);
        }
        .header-logo {
            height: 44px;
            width: auto;
            max-width: 170px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .header-center {
            flex: 1;
            text-align: center;
        }
        .logo-mark {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .header-logo-img {
            max-width: 190px;
            object-fit: contain;
        }
        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 14px;
        }
        .action-btn {
            border: 1px solid var(--border);
            background: #fff;
            color: var(--ink);
            padding: 8px 12px;
            border-radius: 7px;
            font: 600 12px 'Inter', sans-serif;
            cursor: pointer;
        }
        .action-btn.primary {
            background: #1F5F78;
            color: #fff;
            border-color: #1F5F78;
        }
        .action-btn:hover {
            filter: brightness(.97);
        }
        .info-strip {
            background: #F4F8FA;
            border: 1px solid #D7E5EA;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 11.5px;
            color: #35515D;
            margin-bottom: 14px;
            line-height: 1.5;
        }
        .forecast-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-end;
            margin-bottom: 12px;
        }
        .forecast-select {
            min-width: 280px;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            font: 12px 'Inter', sans-serif;
            background: #fff;
            color: var(--ink);
        }
        .forecast-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11.5px;
        }
        .forecast-table th,
        .forecast-table td {
            padding: 8px 7px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        .forecast-table th {
            font-size: 10.5px;
            color: var(--ink-soft);
            text-transform: uppercase;
            letter-spacing: .25px;
            text-align: left;
            background: #FAFAF7;
        }
        .forecast-table .right {
            text-align: right;
        }
        .forecast-input {
            width: 110px;
            border: 1px solid #C9D8DE;
            border-radius: 5px;
            padding: 6px 7px;
            font: 12px 'JetBrains Mono', monospace;
            text-align: right;
            background: #fff;
        }
        .forecast-input:focus {
            outline: 2px solid rgba(31, 95, 120, .15);
            border-color: #1F5F78;
        }
        .forecast-input[disabled] {
            background: #F4F2EC;
            color: #8A8A84;
            border-color: #E4E1D8;
        }
        .forecast-pct {
            display: inline-block;
            min-width: 64px;
            text-align: center;
            padding: 4px 7px;
            border-radius: 999px;
            font: 600 11px 'JetBrains Mono', monospace;
        }
        .forecast-month {
            font-weight: 600;
            white-space: nowrap;
        }
        .forecast-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 0 0 14px;
        }
        .summary-mini {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 11px 12px;
            background: #fff;
        }
        .summary-mini .k {
            font-size: 10px;
            color: var(--ink-soft);
            text-transform: uppercase;
            letter-spacing: .4px;
        }
        .summary-mini .v {
            font-size: 18px;
            font-weight: 700;
            margin-top: 3px;
        }
        .tracker-toolbar {
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .tracker-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 22px;
            height: 22px;
            padding: 0 6px;
            border-radius: 999px;
            background: #eaf3f6;
            color: #1f5f78;
            font: 700 11px 'JetBrains Mono', monospace;
            vertical-align: middle;
            margin-left: 4px;
        }
        .tracker-form {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(0, 1.35fr) minmax(0, 1.75fr) 170px 155px 110px;
            gap: 12px;
            align-items: stretch;
            margin: 14px 0 16px;
            padding: 14px;
            border: 1px solid #dfe6e8;
            border-radius: 10px;
            background: #fbfcfc;
        }
        .tracker-field {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .tracker-form label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            color: #66757c;
            margin-bottom: 6px;
            letter-spacing: .45px;
        }
        .tracker-form input,
        .tracker-form textarea {
            box-sizing: border-box;
            width: 100%;
            border: 1px solid #cfd9dd;
            border-radius: 7px;
            padding: 9px 10px;
            font: 11.5px 'Inter', sans-serif;
            color: var(--ink);
            background: #fff;
            min-height: 38px;
            resize: none;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        .tracker-form textarea {
            height: 74px;
            line-height: 1.4;
            overflow: auto;
        }
        .tracker-form input {
            height: 38px;
        }
        .tracker-form input:focus,
        .tracker-form textarea:focus {
            border-color: #1f5f78;
            box-shadow: 0 0 0 3px rgba(31, 95, 120, .09);
        }
        .tracker-form .action-btn {
            height: 38px;
            align-self: end;
            white-space: nowrap;
        }
        .tracker-table-wrap {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #dfe6e8;
            border-radius: 10px;
            background: #fff;
        }
        .tracker-table {
            width: 100%;
            min-width: 1040px;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            font-size: 11.5px;
        }
        .tracker-table th,
        .tracker-table td {
            padding: 10px 11px;
            border-bottom: 1px solid #e7ecee;
            vertical-align: top;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.45;
        }
        .tracker-table th {
            background: #f4f7f8;
            color: #58686f;
            font-size: 9.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .45px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .tracker-table th:nth-child(1),
        .tracker-table td:nth-child(1) {
            width: 42px;
            text-align: center;
        }
        .tracker-table th:nth-child(2),
        .tracker-table td:nth-child(2) {
            width: 18%;
        }
        .tracker-table th:nth-child(3),
        .tracker-table td:nth-child(3) {
            width: 18%;
        }
        .tracker-table th:nth-child(4),
        .tracker-table td:nth-child(4) {
            width: 24%;
        }
        .tracker-table th:nth-child(5),
        .tracker-table td:nth-child(5) {
            width: 13%;
        }
        .tracker-table th:nth-child(6),
        .tracker-table td:nth-child(6) {
            width: 12%;
            white-space: nowrap;
        }
        .tracker-table th:nth-child(7),
        .tracker-table td:nth-child(7) {
            width: 9%;
            text-align: center;
            white-space: nowrap;
        }
        .tracker-table tbody tr:last-child td {
            border-bottom: 0;
        }
        .tracker-table tbody tr:hover td {
            background: #fbfdfd;
        }
        .tracker-delete {
            border: 1px solid #ead6cf;
            background: #fff7f4;
            color: #993C1D;
            cursor: pointer;
            font-size: 10px;
            font-weight: 700;
            border-radius: 6px;
            padding: 5px 8px;
        }
        .tracker-delete:hover {
            background: #fbe9e2;
        }
        .tracker-empty {
            padding: 28px;
            text-align: center;
            color: var(--ink-soft);
            font-size: 12px;
            border: 1px dashed #cfd9dd;
            border-radius: 8px;
            background: #fbfcfc;
        }
        @media(max-width:1100px) {
            .tracker-form {
                grid-template-columns: 1fr 1fr 1.4fr 150px 140px 105px;
            }
        }
        .export-preview {
            overflow: auto;
        }
        .forecast-chart-wrap {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
            padding: 14px;
            margin: 14px 0 16px;
            height: 320px;
            position: relative;
        }
        .forecast-chart-title {
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .forecast-chart-sub {
            font-size: 10px;
            color: var(--ink-soft);
            margin-bottom: 8px;
        }
        .chat-panel {
            min-height: 520px;
        }
        .chat-access {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 22px;
            border: 1px solid #d7e5ea;
            border-radius: 14px;
            background: linear-gradient(135deg, #f4fbfd, #fff);
        }
        .chat-access h3 {
            margin: 0 0 6px;
            font-size: 18px;
        }
        .chat-access p {
            margin: 0;
            color: var(--ink-soft);
            font-size: 12px;
            line-height: 1.5;
        }
        .chat-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1f5f78;
            color: #fff;
            border: 0;
            border-radius: 9px;
            padding: 11px 16px;
            font: 700 12px Inter, sans-serif;
            cursor: pointer;
            white-space: nowrap;
        }
        .news-source-status {
            font-size: 9px;
            color: var(--ink-soft);
            margin-top: 8px;
        }
        @media(max-width:700px) {
            .chat-access {
                flex-direction: column;
                align-items: flex-start
            }
            .chat-btn {
                width: 100%;
                justify-content: center
            }
            .forecast-chart-wrap {
                height: 280px;
            }
        }
        @media (max-width:900px) {
            .forecast-summary {
                grid-template-columns: 1fr;
            }
            .tracker-form {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .tracker-form textarea {
                height: 68px;
            }
            .tracker-form .action-btn {
                width: 100%;
            }
            .forecast-head {
                align-items: stretch;
                flex-direction: column;
            }
            .forecast-select {
                min-width: 0;
                width: 100%;
            }
        }
        @media (max-width: 900px) {
            .header-logo-img {
                height: 30px !important;
            }
        }
        .logo-mark .dot {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: 'Fraunces', serif;
            font-weight: 700;
            font-size: 14px;
        }
        .logo-mark .word {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            font-size: 15px;
            line-height: 1.15;
        }
        .logo-mark .word small {
            display: block;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 9px;
            color: var(--ink-soft);
            letter-spacing: 0.4px;
        }
        .eyebrow {
            font-size: 11.5px;
            letter-spacing: 1.2px;
            color: var(--ink-soft);
            margin-bottom: 4px;
        }
        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            font-size: 25px;
            margin: 0;
            color: #3B4A9E;
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 22px;
        }
        .metric {
            border-radius: 8px;
            padding: 16px 12px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
            color: #fff;
            box-shadow: 0 3px 10px rgba(31, 36, 48, 0.10);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .metric:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(31, 36, 48, 0.16);
        }
        .metric .label {
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.6px;
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase;
        }
        .metric svg {
            width: 26px;
            height: 26px;
            stroke: #fff;
            stroke-width: 1.4;
        }
        .metric .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 17px;
            font-weight: 600;
            white-space: nowrap;
        }
        .metric .sub {
            font-size: 10.5px;
            color: rgba(255, 255, 255, 0.75);
        }
        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 18px;
            box-shadow: 0 2px 8px rgba(31, 36, 48, 0.04);

        }
        .card:hover {
            box-shadow: 0 6px 18px rgba(31, 36, 48, 0.08);
            transform: translateY(-1px);
        }
        .card-title {
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
        }
        .card-sub {
            font-size: 11px;
            color: var(--ink-soft);
            margin-bottom: 10px;
        }
        .trends {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }
        .chart-box {
            height: 175px;
        }
        .legend-row {
            display: flex;
            gap: 14px;
            margin-top: 4px;
            font-size: 10.5px;
            color: var(--ink-soft);
        }
        .legend-row span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .swatch {
            width: 14px;
            height: 2px;
            display: inline-block;
        }
        .donuts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 14px;
        }

            display: flex;
            align-items: center;
            justify-content: center;
        }
        .donut-canvas-wrap {
            width: 120px;
            height: 120px;
            flex-shrink: 0;
        }
        .donut-legend {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-left: 12px;
            justify-content: center;
        }
        .donut-legend div {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            color: var(--ink-soft);
        }
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 2px;
            flex-shrink: 0;
            display: inline-block;
        }
        .monthly-card {
            margin-bottom: 14px;
        }
        .monthly-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            flex-wrap: wrap;
            gap: 8px;
        }
        select {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12.5px;
            color: var(--ink);
            background: #fff;
            max-width: 340px;
            font-family: 'Inter', sans-serif;
        }
        .monthly-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 18px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
        }
        th {
            font-weight: 500;
            color: var(--ink-soft);
            text-align: left;
            padding: 0 8px 8px 0;
        }
        th.right,
        td.right {
            text-align: right;
        }
        td {
            padding: 7px 8px 7px 0;
            border-top: 1px solid var(--border);
        }
        tbody tr {
            transition: background 0.15s ease;
        }
        tbody tr:hover {
            background: #FAF9F5;
        }
        td.mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;

            font-family: 'JetBrains Mono', monospace;
            display: inline-block;
        }
        .mini-chart-title {
            font-size: 11px;
            color: var(--ink-soft);
            margin-bottom: 8px;
        }

            left: 0;
            right: 0;
            text-align: center
        }
        .gauge-value {
            bottom: 23px;
            font-size: 24px;
            font-weight: 850;
            color: #1b3341
        }
        .gauge-unit {
            bottom: 10px;
            font-size: 8px;
            color: #7a8891
        }
        .forecast-target {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #edf1f3;
            padding: 8px 0 0;
            font-size: 9px;
            color: #7c8a92
        }
        .forecast-target b {
            color: #1f3541
        }
        .forecast-note {
            font-size: 8.5px;
            color: #73818a;
            line-height: 1.4;
            margin-top: 7px
        }
        .card {
            border-color: #dce5eb;
            border-radius: 11px;
            box-shadow: 0 5px 16px rgba(31, 55, 72, .06)
        }
        .card-title {
            color: #213744;
            font-size: 12px;
            font-weight: 800
        }
        .card-sub {
            font-size: 9.5px
        }
        .tabs {
            background: #edf2f5
        }
        .tabs button {
            font-size: 10px
        }
        .tabs button.active {
            background: #0a6eaf
        }
        .action-btn.primary {
            background: #0b75bc;
            border-color: #0b75bc
        }
        .save-btn {
            background: #0b75bc
        }
        @media(max-width:1100px) {
            .metrics {
                grid-template-columns: repeat(3, 1fr)
            }
            .home-grid {
                grid-template-columns: 1fr 1fr
            }
            .news-card {
                grid-column: 1/-1;
                grid-row: auto
            }
            .market-price-card,
            .market-summary-card,
            .alert-card {
                grid-column: auto;
                grid-row: auto
            }
            .home-bottom {
                grid-template-columns: 1fr 1fr
            }
            .home-chart-card {
                grid-column: 1/-1
            }
        }
        @media(max-width:800px) {
            .header-bar {
                height: auto;
                min-height: 74px;
                padding: 10px 14px;
                flex-wrap: wrap
            }
            .brand-left {
                min-width: 0
            }
            .header-center {
                order: 3;
                width: 100%;
                text-align: left
            }
            .header-right {
                margin-left: auto
            }
            .sidebar {
                width: 100%;
                min-height: auto;
                position: static;
                display: flex;
                overflow: auto;
                padding: 8px;
                gap: 4px
            }
            .sidebar-label,
            .nav-hint {
                display: none
            }
            .nav-item {
                min-width: max-content
            }
            .app-shell {
                flex-direction: column
            }
            .content {
                padding: 12px
            }
            .home-grid,
            .home-bottom {
                grid-template-columns: 1fr
            }
            .news-card,
            .market-price-card,
            .market-summary-card,
            .alert-card {
                grid-column: auto;
                grid-row: auto
            }
            .hero-meta {
                display: none
            }
        }
        @media(max-width:600px) {
            .metrics {
                grid-template-columns: 1fr 1fr
            }
            .home-title {
                font-size: 24px
            }
            .news-item {
                grid-template-columns: 70px 1fr
            }
            .news-thumb {
                width: 70px;
                height: 55px
            }
        }

        /* real-time price blink indicator */
        .price-updated {
            animation: pulse-green 0.6s ease;
        }
        .price-updated-red {
            animation: pulse-red 0.6s ease;
        }
        @keyframes pulse-green {
            0%,
            100% {
                background-color: transparent;
            }
            50% {
                background-color: rgba(26, 175, 103, 0.15);
            }
        }
        @keyframes pulse-red {
            0%,
            100% {
                background-color: transparent;
            }
            50% {
                background-color: rgba(239, 75, 75, 0.15);
            }
        }
        .live-price-badge {
            font-size: 7px;
            background: #27d17f;
            color: #fff;
            padding: 2px 6px;
            border-radius: 999px;
            margin-left: 4px;
            vertical-align: middle;
        }
        .price-trend-up {
            color: #1aaf67;
        }
        .price-trend-down {
            color: #ef4b4b;
        }
        .price-trend-steady {
            color: #f5a623;
        }
        .last-update-tag {
            font-size: 7.5px;
            color: #7a8992;
            background: #edf4f7;
            padding: 2px 7px;
            border-radius: 999px;
            white-space: nowrap;
        }
    </style>
